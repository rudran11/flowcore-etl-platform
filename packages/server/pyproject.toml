[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flowcore-server"
version = "1.0.0"
description = "REST API gateway and control plane for FlowCore."
authors = ["Rudran <rudran@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "flowcore_server" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
pydantic-settings = "^2.3.0"
sqlalchemy = "^2.0.30"
asyncpg = "^0.30.0"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"
flowcore = { path = "../flowcore", develop = true }
flowcore-shared = { path = "../shared", develop = true }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "^4.1.2"
PyJWT = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
