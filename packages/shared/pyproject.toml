[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flowcore-shared"
version = "1.0.0"
description = "Shared components and utilities for FlowCore."
authors = ["Rudran <rudran@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "flowcore_shared" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0.0"
pyyaml = "^6.0.1"
httpx = "^0.27.0"
tenacity = "^8.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.0.0"
