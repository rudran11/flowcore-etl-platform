[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flowcore-cli"
version = "1.0.0"
description = "Command Line Interface for FlowCore."
authors = ["Rudran <rudran@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "flowcore_cli" }]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.7"
flowcore-sdk = { path = "../sdk", develop = true }

[tool.poetry.scripts]
flowcore = "flowcore_cli.main:cli"
