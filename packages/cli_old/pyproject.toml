[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flowcore-cli"
version = "0.6.0"
description = "Command Line Interface for FlowCore Developer Experience."
authors = ["Rudran <rudran@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "flowcore_cli" }]

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.12.0"
click = "<8.2.0"
rich = "^13.7.0"
tomlkit = "^0.12.0"
httpx = "^0.27.0"
pydantic = "^2.0.0"
flowcore-engine = { path = "../engine", develop = true }
flowcore-shared = { path = "../shared", develop = true }

[tool.poetry.scripts]
flowcore = "flowcore_cli.main:app"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
