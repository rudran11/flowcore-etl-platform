[project]
name = "flowcore-connector-postgres"
version = "0.1.0"
description = "A PostgreSQL Source and Destination connector for FlowCore."
authors = [
    { name = "FlowCore Contributors" }
]
dependencies = [
    "flowcore-shared>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "tenacity>=8.2.3"
]

[project.entry-points."flowcore.plugins"]
source-postgres = "flowcore_connector_postgres.source:PostgresSourcePlugin"
destination-postgres = "flowcore_connector_postgres.destination:PostgresDestinationPlugin"
