[project]
name = "flowcore-connector-parquet"
version = "0.1.0"
description = "A Parquet Source and Destination connector for FlowCore."
authors = [
    { name = "FlowCore Contributors" }
]
dependencies = [
    "flowcore-shared>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=10.0.0"
]

[project.entry-points."flowcore.plugins"]
source-parquet = "flowcore_connector_parquet.source:ParquetSourcePlugin"
destination-parquet = "flowcore_connector_parquet.destination:ParquetDestinationPlugin"
